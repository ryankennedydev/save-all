<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Sem imagem" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E2929"/>
      <stop offset="1" stop-color="#1F1B1B"/>
    </linearGradient>
    <radialGradient id="brilhoA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilhoB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pontos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Fundo -->
  <rect width="600" height="400" fill="url(#fundo)"/>
  <rect width="600" height="400" fill="url(#pontos)"/>

  <!-- Brilhos suaves -->
  <circle cx="480" cy="70" r="200" fill="url(#brilhoA)"/>
  <circle cx="110" cy="350" r="190" fill="url(#brilhoB)"/>

  <!-- Ícone central -->
  <g transform="translate(300 200)">
    <rect x="-52" y="-42" width="104" height="84" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="-22" cy="-14" r="8" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M-40 30 L-10 2 L8 20 L22 6 L40 30" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
