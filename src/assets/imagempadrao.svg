<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#17151A"/>
      <stop offset="55%" stop-color="#111014"/>
      <stop offset="100%" stop-color="#09090B"/>
    </radialGradient>

    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#303037"/>
      <stop offset="100%" stop-color="#15151A"/>
    </linearGradient>

    <linearGradient id="bookmark" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity=".55"/>
    </filter>

    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity=".055"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="180" cy="650" rx="390" ry="260" fill="url(#amberGlow)" filter="url(#blur40)"/>
  <ellipse cx="1040" cy="120" rx="330" ry="250" fill="url(#purpleGlow)" filter="url(#blur40)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>

  <!-- Subtle decorative curves -->
  <path d="M-100 650 C180 500 280 780 570 620" stroke="#F59E0B" stroke-opacity=".09" stroke-width="2"/>
  <path d="M720 -80 C900 150 1080 40 1300 250" stroke="#818CF8" stroke-opacity=".07" stroke-width="2"/>

  <!-- Ambient glow behind icon -->
  <ellipse cx="600" cy="500" rx="190" ry="75" fill="#F59E0B" fill-opacity=".16" filter="url(#blur18)"/>

  <!-- Floating note card -->
  <g transform="rotate(-5 600 400)" filter="url(#shadow)">
    <rect x="465" y="285" width="270" height="235" rx="38" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
    <rect x="466" y="286" width="268" height="232" rx="37" fill="none" stroke="#000" stroke-opacity=".35"/>

    <!-- Text lines -->
    <rect x="515" y="385" width="72" height="12" rx="6" fill="#A1A1AA" fill-opacity=".65"/>
    <rect x="515" y="420" width="138" height="12" rx="6" fill="#A1A1AA" fill-opacity=".48"/>
    <rect x="515" y="455" width="102" height="12" rx="6" fill="#A1A1AA" fill-opacity=".38"/>

    <!-- Bookmark -->
    <path d="M650 300 H708 V398 L679 378 L650 398 Z" fill="url(#bookmark)"/>
    <path d="M650 300 H708" stroke="#FFF4D6" stroke-opacity=".45" stroke-width="2"/>
  </g>

  <!-- Spark accents -->
  <g stroke="#FFD166" stroke-width="8" stroke-linecap="round">
    <path d="M766 310 L776 278"/>
    <path d="M797 329 L821 306"/>
    <path d="M806 360 L838 357"/>
  </g>

  <!-- Small floating bookmark silhouettes -->
  <g opacity=".12" filter="url(#blur18)">
    <path d="M155 170 H205 V250 L180 232 L155 250 Z" fill="#F59E0B"/>
    <path d="M1000 610 H1050 V690 L1025 672 L1000 690 Z" fill="#F59E0B"/>
  </g>
</svg>